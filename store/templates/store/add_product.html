<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - Bartan Craft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 6px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>

</head>


<body>

    <header>

        <h1>🍳 Bartan Craft</h1>

        <a href="{% url 'operator_dashboard' %}">
            Dashboard
        </a>

    </header>


    <div class="container">

        <h2>Add New Product</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Product Name</label>

            <input type="text" name="name" placeholder="Example: Stainless Steel Kadhai" required>


            <label>Description</label>

            <textarea name="description" placeholder="Enter product description" required></textarea>


            <label>Price</label>

            <input type="number" name="price" placeholder="Enter price" step="0.01" required>


            <label>Stock</label>

            <input type="number" name="stock" placeholder="Enter stock quantity" min="0" required>


            <label>Product Image URL</label>
            <input type="file" name="image" accept="image/*">


            <button type="submit">
                Add Product
            </button>

        </form>

    </div>

</body>

</html>
