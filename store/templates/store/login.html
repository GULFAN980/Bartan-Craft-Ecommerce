<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BartanCraft</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e293b
                );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111827;
        }


        /* CARD */

        .login-card {

            width: 420px;
            max-width: 92%;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.30);

        }


        /* LOGO */

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;

            color: #111827;

        }

        .logo span {
            color: #f59e0b;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

            font-size: 14px;

        }


        /* FORM */

        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        input:focus {

            border-color: #f59e0b;

            box-shadow:
                0 0 0 3px rgba(245,158,11,0.15);

        }


        /* ERROR */

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

        }


        /* BUTTON */

        .login-btn {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 9px;

            background: #f59e0b;

            color: #111827;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s;

        }


        .login-btn:hover {

            background: #fbbf24;

            transform: translateY(-1px);

        }


        /* REGISTER */

        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;

        }


        .register-text a {

            color: #ea580c;

            font-weight: 700;

            text-decoration: none;

        }


        .register-text a:hover {

            text-decoration: underline;

        }


        /* HOME */

        .home-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #374151;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .home-link:hover {

            color: #f59e0b;

        }


        @media(max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }

        }

    </style>

</head>


<body>


    <div class="login-card">


        <div class="logo">

            Bartan<span>Craft</span>

        </div>


        <p class="subtitle">

            Login to your BartanCraft account

        </p>


        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="{% url 'store:register' %}">
                Register
            </a>

        </div>


        <a
            href="{% url 'store:home' %}"
            class="home-link"
        >

            ← Back to Home

        </a>


    </div>


</body>

</html>
