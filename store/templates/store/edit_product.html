<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - BartanCraft</title>

</head>

<body>

<h1>Edit Product</h1>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    <label>Product Name</label>

    <input
        type="text"
        name="name"
        value="{{ product.name }}"
        required
    >

    <br><br>

    <label>Description</label>

    <textarea
        name="description"
        required
    >{{ product.description }}</textarea>

    <br><br>

    <label>Price</label>

    <input
        type="number"
        name="price"
        value="{{ product.price }}"
        step="0.01"
        min="0"
        required
    >

    <br><br>

    <label>Stock</label>

    <input
        type="number"
        name="stock"
        value="{{ product.stock }}"
        min="0"
        required
    >

    <br><br>

    <label>Change Image</label>

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <br><br>

    <button type="submit">
        Update Product
    </button>

</form>

<br>

<a href="{% url 'store:operator_dashboard' %}">
    ← Back to Dashboard
</a>

</body>

</html>
