<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BartanCraft</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #fff7ed);

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 420px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #f59e0b;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 28px;
        }

        label {
            display: block;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 16px;

            font-size: 15px;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #f59e0b;

            color: #111827;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            background: #fbbf24;
        }

        .login {
            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .login a {
            color: #ea580c;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">
        Bartan<span>Craft</span>
    </div>

    <p class="subtitle">
        Create your customer account
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Choose username"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">

        Already have an account?

        <a href="{% url 'store:login' %}">
            Login
        </a>

    </div>

</div>

</body>

</html>
